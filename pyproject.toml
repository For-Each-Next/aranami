[project]
name = "aranami"
version = "0.7.0"
description = "Toolforge automation for Wikipedia reports and a read-only dashboard."
readme = "README.md"
authors = [
    { name = "For Each ... Next", email = "for_each_next@outlook.com" },
]
license = "CC0-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
keywords = ["dashboard", "mediawiki", "pywikibot", "toolforge", "wikipedia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Wiki",
    "Topic :: Utilities",
    "Private :: Do Not Upload",
]
dependencies = [
    "apscheduler",
    "dateparser",
    "flask",
    "jieba",
    "mwparserfromhell",
    "opencc-python-reimplemented",
    "polars",
    "pymysql",
    "pywikibot[mwoauth]",
    "python-dateutil",
    "sqlalchemy",
    "tqdm",
    "waitress",
]

[project.urls]
Homepage = "https://aranami.toolforge.org/"

[dependency-groups]
dev = [
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
fix = true
line-length = 79
preview = true
show-fixes = true
target-version = "py315"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72

[tool.ruff.lint]
ignore = [
    "missing-copyright-notice",
    "unnecessary-assign",
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["implicit-namespace-package"]
"tests/**/*.py" = ["assert", "implicit-namespace-package"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pycodestyle]
max-doc-length = 72
max-line-length = 79

[tool.ruff.lint.pydocstyle]
convention = "google"
