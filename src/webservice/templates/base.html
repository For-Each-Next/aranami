<!doctype html>
<html lang="{{ language_tag }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#edf9f4"><meta name="description" content="{{ t.page.description }}"><link rel="icon" href="/aranami.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css">{% if live %}<script src="/live.js" defer></script>{% endif %}<title>{{ heading }} · Aranami</title></head><body><a href="#main" class="skip">{{ t.nav.skip }}</a><header class="masthead"><div class="shell"><a href="/" class="brand"><img src="/aranami.svg" width="36" height="36" alt=""><span>Aranami</span></a><h1>{{ heading }}</h1>{% block navigation %}<nav class="page-toc" aria-label="{{ t.nav.contents }}"><a href="/#backlog">{{ t.nav.backlog }}</a></nav>{% endblock %}</div></header><main class="shell" id="main">{% block content %}{% endblock %}</main><footer><div class="shell footer-inner"><p class="footer-uptime">{% if footer %}{% include "includes/uptime.html" %}{% endif %}</p><nav aria-label="Aranami"><a href="/about/">{{ t.nav.about }}</a><a href="/logs/">{{ t.nav.logs }}</a>{{ project_link }}</nav></div></footer></body></html>
