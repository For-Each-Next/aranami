<span class="article-summary">{% if card.review_icon or card.review_icon_symbol %}<a class="review-icon-link" href="{{ card.review_icon_source }}" title="{{ card.review_icon_label }}">{% if card.review_icon %}<img class="review-icon" src="{{ card.review_icon }}" width="16" height="16" alt="{{ card.review_icon_label }}">{% else %}<svg class="review-icon" width="16" height="16" viewBox="0 0 20 20" role="img" aria-label="{{ card.review_icon_label }}" focusable="false"><title>{{ card.review_icon_label }}</title><use href="/report-icons.svg#{{ card.review_icon_symbol }}"></use></svg>{% endif %}</a>{% endif %}<bdi lang="zh">{{ card.link }}</bdi> {% if card.assessments %}<span class="assessment-chips">{% for assessment in card.assessments %}<span class="assessment-chip cdx-info-chip cdx-info-chip--subtle" data-assessment="{{ assessment.dimension }}" title="{{ assessment.dimension_label }}: {{ assessment.description or assessment.label }}"><span class="cdx-info-chip__text">{{ assessment.label }}</span></span>{% endfor %}</span>{% endif %}</span>
