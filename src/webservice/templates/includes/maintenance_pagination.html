<nav class="pagination" aria-label="{{ t.nav.backlog }}">
  <form class="page-size" action="/maintenance/" method="get">
    {% for name, value in selection.items() if name not in ['page', 'limit'] %}<input type="hidden" name="{{ name }}" value="{{ value }}">{% endfor %}
    <div class="field cdx-field">
      <div class="cdx-label"><label class="cdx-label__label" for="maintenance-limit"><span class="cdx-label__label__text">{{ t.backlog.rows }}</span></label></div>
      <div class="cdx-field__control page-size-selection"><select class="cdx-select" id="maintenance-limit" name="limit">{% for size in ['10', '20', '50'] %}<option value="{{ size }}"{% if size == selection.get('limit', '10') %} selected{% endif %}>{{ size }}</option>{% endfor %}</select><button class="cdx-button cdx-button--action-default cdx-button--weight-normal" type="submit">{{ t.backlog.go }}</button></div>
    </div>
  </form>
  <p>{{ range_label }}</p>
  {% if previous %}<a class="cdx-button cdx-button--fake-button cdx-button--fake-button--enabled cdx-button--action-default cdx-button--weight-normal" href="{{ previous }}" rel="prev">{{ t.backlog.previous }}</a>{% endif %}
  {% if following %}<a class="cdx-button cdx-button--fake-button cdx-button--fake-button--enabled cdx-button--action-default cdx-button--weight-normal" href="{{ following }}" rel="next">{{ t.backlog.next }}</a>{% endif %}
</nav>
