<div class="ui-accordion__content"><div class="ui-text-area newsletter-text"><textarea id="newsletter-text-{{ draft_index }}" class="ui-text-area__textarea" aria-labelledby="newsletter-heading-{{ draft_index }} newsletter-code-label-{{ draft_index }}" lang="zh" dir="ltr" rows="8" spellcheck="false" data-newsletter-wikitext readonly>{{ '\n' }}{{ draft.text }}</textarea></div></div>
</details>
