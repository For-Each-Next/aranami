<a class="ui-card backlog-task" href="{{ task.url }}">
{% if task.image %}<img class="maintenance-icon ui-card__icon" src="{{ asset_url(task.image) }}" alt="" width="22" height="22" loading="lazy">{% else %}<svg class="maintenance-icon ui-card__icon" viewBox="0 0 20 20" width="22" height="22" aria-hidden="true" focusable="false"><use href="{{ asset_url('assets/icons/report-icons.svg') }}#template"></use></svg>{% endif %}
<div class="ui-card__text">
<div class="ui-card__text__title">
<h3 class="backlog-label">{{ task.label }}</h3>
</div>
<div class="ui-card__text__supporting-text">
<span class="backlog-count">{{ task.count }}</span>
</div>
</div>

</a>
