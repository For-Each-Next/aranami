<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="44" viewBox="0 0 128 118">
  <title>Video games project peer review</title>
  <desc>A blue gamepad with its D-pad enlarged through a silver magnifying glass with an orange handle.</desc>
  <!--
    Native vector redraw for Aranami, 2026-10-31, of Cvg peerreview icon.png.
    Original: WolfenSilva; PNG optimization: Optimager.
    https://commons.wikimedia.org/wiki/File:Cvg_peerreview_icon.png
    Based on Cscr-mag.png and Gamepad Icon.png (Paranoid, public domain).
    GPL-2.0-or-later. Full license: gpl-2.0.html. No raster content.
    XYAB placement and glass highlights refined for the small display icon.
    The shared gamepad geometry is magnified 1.35 times inside the lens.
  -->
  <defs>
    <linearGradient id="pad" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#477e8c"/>
      <stop offset="0.55" stop-color="#155767"/>
      <stop offset="1" stop-color="#003140"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#81a9af"/>
      <stop offset="1" stop-color="#285965"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#969b9b"/>
      <stop offset="0.23" stop-color="#fafcfb"/>
      <stop offset="0.49" stop-color="#777e80"/>
      <stop offset="0.77" stop-color="#f3f5f1"/>
      <stop offset="1" stop-color="#626765"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ad2703"/>
      <stop offset="0.3" stop-color="#f17606"/>
      <stop offset="0.6" stop-color="#fff36e"/>
      <stop offset="1" stop-color="#ffb324"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.35" cy="0.24" r="0.8">
      <stop stop-color="#d1f3fa" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#87c4dc" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#286b8a" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="blue" cx="0.3" cy="0.2" r="0.85">
      <stop stop-color="#23cbff"/>
      <stop offset="1" stop-color="#00628f"/>
    </radialGradient>
    <radialGradient id="green" cx="0.3" cy="0.2" r="0.85">
      <stop stop-color="#6af789"/>
      <stop offset="1" stop-color="#00a62c"/>
    </radialGradient>
    <radialGradient id="yellow" cx="0.3" cy="0.2" r="0.85">
      <stop stop-color="#fff950"/>
      <stop offset="1" stop-color="#f4a500"/>
    </radialGradient>
    <linearGradient id="button-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="lens-reflection" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="0.7" stop-color="#e5faff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#e5faff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lens-interior">
      <circle cx="46" cy="45" r="36.2"/>
    </clipPath>
    <mask id="outside-lens" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="118">
      <rect width="128" height="118" fill="#fff"/>
      <circle cx="46" cy="45" r="36.2" fill="#000"/>
    </mask>
    <g id="gamepad">
      <path d="M14 34Q9 40 7 55L1 101Q0 111 7 113L17 114Q23 113 26 104L34 78H91L102 106Q106 114 115 114L121 112Q127 109 126 100L122 57Q121 41 112 34L110 26Q108 21 101 21H91L88 18H78L74 24H39L36 19H23Q17 21 16 29Z" fill="#163c43" opacity="0.55"/>
      <path d="M16 32Q10 39 9 54L3 100Q1 108 8 110L17 111Q22 110 24 102L33 75H92L103 104Q106 111 114 111L121 109Q124 107 123 99L120 56Q119 41 110 34L108 25H91L87 19H80L76 27H39L34 22H23Q17 22 16 32Z" fill="url(#pad)" stroke="#3e747a" stroke-width="2"/>
      <path d="M23 32Q14 36 14 52L17 68Q21 77 32 77H98Q112 76 116 63L114 47Q111 34 101 31L87 30H42Z" fill="url(#face)" stroke="#51818b" stroke-width="1.5"/>
      <path d="M24 24H34L39 29H21Z" fill="#39788c"/>
      <path d="M91 22H106L108 28H90Z" fill="#174b61"/>
      <path d="M58 32H79V37H58Z" fill="#a8a46a" opacity="0.8"/>
      <path d="M59 37H77V40H59Z" fill="#143d4e"/>
      <path d="M29 44H37V50H43V58H37V65H29V58H23V50H29Z" fill="#173176" stroke="#376b9e" stroke-width="2"/>
      <rect x="50" y="65" width="9" height="5" rx="2" fill="#1f515d"/>
      <rect x="68" y="65" width="9" height="5" rx="2" fill="#1f515d"/>
      <path d="M50 71H59M68 71H77" stroke="#e0d778" stroke-width="1.5"/>
      <g id="face-buttons" transform="translate(-5 9)">
        <circle cx="102" cy="34" r="6.7" fill="#064c6b"/>
        <circle cx="102" cy="34" r="5.1" fill="url(#blue)"/>
        <ellipse cx="101.5" cy="31.8" rx="3.6" ry="1.8" fill="url(#button-gloss)"/>
        <circle cx="113" cy="46" r="6.7" fill="#125c50"/>
        <circle cx="113" cy="46" r="5.1" fill="url(#green)"/>
        <ellipse cx="112.5" cy="43.8" rx="3.6" ry="1.8" fill="url(#button-gloss)"/>
        <circle cx="91" cy="46" r="6.7" fill="#743634"/>
        <circle cx="91" cy="46" r="5.1" fill="#e62324"/>
        <ellipse cx="90.5" cy="43.8" rx="3.6" ry="1.8" fill="url(#button-gloss)"/>
        <circle cx="102" cy="58" r="6.7" fill="#8d6d11"/>
        <circle cx="102" cy="58" r="5.1" fill="url(#yellow)"/>
        <ellipse cx="101.5" cy="55.8" rx="3.6" ry="1.8" fill="url(#button-gloss)"/>
      </g>
    </g>
  </defs>
  <use href="#gamepad" mask="url(#outside-lens)"/>
  <!-- Magnification about c=(46,45), s=1.35:
       x' = 46 + 1.35 * (x - 46), y' = 45 + 1.35 * (y - 45).
       The base is masked out here, so only the enlarged gamepad is visible. -->
  <g clip-path="url(#lens-interior)">
    <use href="#gamepad" transform="translate(46 45) scale(1.35) translate(-46 -45)"/>
  </g>
  <path d="M78 77 88 79 119 108Q122 113 118 117Q114 120 110 116L80 87Z" fill="#663b22" opacity="0.55"/>
  <path d="M79 75 88 78 118 107Q123 112 118 116Q114 119 109 114L79 85Z" fill="url(#handle)" stroke="#b94a0b" stroke-width="2"/>
  <path d="M87 80 115 108" stroke="#fff8ad" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M73 69 87 81 82 87 69 75Z" fill="url(#silver)" stroke="#737775" stroke-width="2"/>
  <circle cx="47" cy="47" r="40.5" fill="none" stroke="#343a38" stroke-width="7" opacity="0.65"/>
  <circle cx="46" cy="45" r="39.5" fill="none" stroke="#5e6362" stroke-width="8"/>
  <circle cx="46" cy="45" r="39.5" fill="none" stroke="url(#silver)" stroke-width="6"/>
  <circle cx="46" cy="45" r="36.2" fill="url(#glass)" stroke="#577a8c" stroke-width="1.5"/>
  <path d="M21 30Q31 16 46 14L61 74Q54 79 46 79Z" fill="url(#lens-reflection)" clip-path="url(#lens-interior)"/>
  <path d="M14 48A33 33 0 0 1 65 17" fill="none" stroke="#eefaff" stroke-width="2.5" opacity="0.85"/>
  <path d="M34 13Q45 9 58 14L64 21Q50 18 39 21Z" fill="#f5fdff" opacity="0.8"/>
  <path d="M19 71Q42 88 65 72" fill="none" stroke="#c5e6e9" stroke-width="2" opacity="0.55"/>
</svg>
