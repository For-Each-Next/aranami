name: Validate

on:
  workflow_call:

permissions:
  contents: read

env:
  PYWIKIBOT_NO_USER_CONFIG: "2"
  PYTHONPATH: src

jobs:
  validate:
    name: Validate source deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.15
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.3"
          python-version: "3.15.0"
          enable-cache: true

      - name: Check lockfile
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run --locked ruff check --no-fix .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Check deployment shell syntax
        run: |
          for script in scripts/toolforge/*.sh; do sh -n "$script"; done

      - name: Run offline unit tests
        run: uv run --locked python -m unittest discover -s tests/unit -v

      - name: Run offline integration tests
        run: uv run --locked python -m unittest discover -s tests/integration -v

      - name: Run offline website Python tests
        run: uv run --locked python -m unittest discover -s tests/toolforge -p 'test_*.py' -v

      - name: Validate source payload
        run: |
          mkdir -p dist
          uv run --locked python scripts/upload_toolforge.py --dry-run --archive dist/aranami-source.tar
          temporary_payload=$(mktemp -d)
          tar -xf dist/aranami-source.tar -C "$temporary_payload"
          uv run --locked python scripts/toolforge/validate-source.py verify "$temporary_payload"

      - name: Validate formal release tag
        if: github.ref_type == 'tag'
        run: |
          uv run --locked python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if re.fullmatch(r"\d+\.\d+\.\d+", version) is None:
              raise SystemExit("Formal release tags require a base version.")
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("Release tag must match the source project version.")
          PY

      - name: Extract release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          uv run --locked python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"][1:]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.search(
              rf"(?ms)^### {re.escape(version)} \([^\n]+\)\n"
              rf"(.*?)(?=^## |^### |\Z)", changelog,
          )
          if section is None or not section[1].strip():
              raise SystemExit(f"Missing changelog entry for {version}.")
          Path("dist/release-notes.md").write_text(
              section[1].strip() + "\n", encoding="utf-8",
          )
          PY

      - name: Upload source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
