name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          test "${wheels[0]}" = "dist/aranami-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          test -s dist/release-notes.md
          gh release create "$GITHUB_REF_NAME" "${wheels[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Aranami ${GITHUB_REF_NAME#v}" \
            --notes-file dist/release-notes.md
